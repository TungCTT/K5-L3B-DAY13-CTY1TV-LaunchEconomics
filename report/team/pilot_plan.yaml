# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels: 1.250)
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 mỗi nhóm -> cần 42 nhân viên/nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 20 / 0,02 = 1.000 (< 1.251: không đạt mức chênh 5 điểm)
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 6 / 0,02 = 300 (dưới 20 cụm mỗi nhóm: loại)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi nhân viên (DE = 6,96; n_eff = 859,2)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc song song cùng thời gian và cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên 50/50 bằng code theo seed chốt trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ chia sẻ gợi ý trong cùng depot; giảm bằng phân quyền theo tài khoản và log mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã chốt trước ngày chạy trong file kế hoạch này.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên hiện có, không cách chia theo cụm nào đủ 1.251 mẫu hiệu dụng cho mức chênh 5 điểm (tối đa < 1.000).
#   Nhóm chọn chia theo nhân viên (20 + 20) để tách được tác động và chấp nhận MDE 6 điểm (m >= 299 yêu cầu/nhân viên ở bước 0,50).
#   Rủi ro bất lợi đã ghi nhận: nếu tác động thật chỉ đạt 5 điểm với n = 859, power giảm còn 0,64 (cần Giám đốc vận hành ký chấp nhận).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Dữ liệu chạy thử: 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982).
#   Không đặt ngưỡng dừng tuyệt đối 3% vì sẽ dừng ngay tuần đầu; đặt ngưỡng tương đối >= +2 điểm so với đối chứng kèm trần 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "12 depot; chỉ yêu cầu noi_dia (0,22x, simulated) và hang_nang (0,69x, simulated); loại quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên; chỉ đo chỉ số chính tại bước 0,50 để đủ m >= 299 yêu cầu/nhân viên
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên nhóm đối chứng xử lý song song trong cùng khung thời gian và cùng 12 depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Phân tầng ngẫu nhiên theo depot bằng seed cố định; phân quyền truy cập trợ lý theo tài khoản staff_id và log lượt mở gợi ý để phát hiện dùng chéo"
    predeclared: "Đã viết trước chỉ số chính (mde 0,06; power 0,80; hoặc 0,64 ở mức 5 điểm), ngưỡng dừng, vai trò phụ trách và ngày quyết định 2027-01-05"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt trần 6% (nền 3,97%-4,25%), hoặc có >= 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý qua feature flag trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công đo bằng phút thật > 8.000 đ (hoặc tỉ lệ xem lại còn > 50% cuối bước 0,25) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng thêm hang_nang hoặc tăng tỉ lệ rollout"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% (nền chạy thử 27,12%) TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và rà 20 trace trong 3 ngày làm việc KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "Chỉ kiểm tra chỉ số an toàn, chi phí thực tế và tỉ lệ bỏ qua gợi ý hằng tuần; không dừng sớm vì thắng trước khi đủ mẫu tại bước 0,50"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực tối đa 30 phút; toàn bộ yêu cầu hoàn phí chuyển ngay về luồng nhân viên CSKH tự làm (6 phút/yêu cầu)"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated và phut_lam_lai_simulated (tổng 890 phút xem lại và 1.132 phút làm lại trong 1.200 yêu cầu chạy thử, simulated)"
    - "Chi phí mỗi việc thành công chung 4.472 đ và phạm vi noi_dia (2.696 đ = 0,22x), hang_nang (8.221 đ = 0,69x) đều là số simulated"
    - "Kịch bản xem lại 100% ở noi_dia + hang_nang: 11.743 đ = 0,98x (9 phút làm lại) hoặc 12.415 đ = 1,03x (15,3 phút làm lại), là số simulated và phải thay bằng phút đo thật sau tuần 1"
